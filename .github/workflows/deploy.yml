name: Deploy no servidor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o servidor via SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy ubuntu@168.75.71.223 'cd /opt/alianca-backend && sudo git pull && sudo npm install --no-audit --no-fund && sudo systemctl restart alianca-backend && echo DEPLOY_OK'
