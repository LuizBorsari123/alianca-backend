<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aliança</title>
<meta name="theme-color" content="#1f6f5f">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aliança">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#e7ecea; --surface:#f8faf9; --card:#fff; --line:#d5ddda;
  --ink:#16302b; --muted:#5d716c; --accent:#1f6f5f; --accent-soft:#dcefe9;
  --gold:#a8792a; --gold-soft:#f5ead6; --bad:#b4372f; --bad-soft:#f8e1de; --good:#2f7d4f;
  --track:#e3eae7;
  --display:"Fraunces",Georgia,serif; --body:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --ground:#0d1715; --surface:#14211e; --card:#1b2b27; --line:#2b3e39;
  --ink:#e6efec; --muted:#9db1ab; --accent:#5fbfa8; --accent-soft:#1d3a33;
  --gold:#e0b468; --gold-soft:#3a3020; --bad:#f08a80; --bad-soft:#3d2220; --good:#72c995; --track:#223430;
}
:root[data-skin="ela"]{
  --ground:#f3e9ee; --surface:#fdf7fa; --card:#fff; --line:#e7d4de;
  --ink:#3a1f30; --muted:#8a6577; --accent:#b14a7e; --accent-soft:#f6e1ec;
  --gold:#b07d3a; --gold-soft:#f5e7d6; --track:#efe0e8;
}
:root[data-theme="dark"][data-skin="ela"]{
  --ground:#1c1016; --surface:#241720; --card:#2c1d28; --line:#3f2b38;
  --ink:#f3e3ec; --muted:#c59db2; --accent:#e58fb6; --accent-soft:#3a2230;
  --gold:#e0b468; --gold-soft:#3a3020; --track:#2e1e2a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px);
  max-width:460px;margin:0 auto;min-height:100vh;font-size:15px;-webkit-tap-highlight-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:30px;height:30px;border-radius:7px}
.brand b{font-family:var(--display);font-weight:500;font-size:1.4rem}
.who{font-size:.82rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--accent-soft);border-color:transparent}
.hero.alert{background:var(--bad-soft)} .hero.warn{background:var(--gold-soft)}
.label{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-size:1.5rem;font-weight:500;line-height:1.15;margin:0}
p{margin:0;color:var(--muted);line-height:1.45;font-size:.9rem}
p.ink{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.wait{background:var(--gold-soft);color:var(--gold)}
.btn{border:0;border-radius:12px;padding:14px;font:600 .95rem var(--body);width:100%;cursor:pointer;margin-top:2px}
.btn.primary{background:var(--ink);color:var(--surface)} .btn.accent{background:var(--accent);color:#fff}
.btn.soft{background:var(--accent-soft);color:var(--accent)} .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff} .btn:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input{font:500 1rem var(--body);padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .88rem var(--body);padding:12px;border-radius:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.verse{font-family:var(--display);font-size:1.18rem;font-weight:400;line-height:1.4;margin:0;color:var(--ink)}
.ref{font-size:.78rem;color:var(--gold);font-weight:700;letter-spacing:.04em}
.goal b{font-family:var(--display);font-size:2.1rem;font-weight:500;line-height:1}
.bar{position:relative;height:10px;background:var(--track);border-radius:999px;margin:12px 0 18px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.bar .mk{position:absolute;top:50%;width:2px;height:12px;background:var(--card);transform:translateY(-50%)}
.bar .lab{position:absolute;top:15px;font-size:.64rem;color:var(--muted);transform:translateX(-50%)}
.bar .lab.done{color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{font-family:var(--display);font-size:1.3rem;font-weight:500;display:block}
.stat span{font-size:.68rem;color:var(--muted)}
.dev{display:flex;flex-direction:column;gap:2px;min-width:0}
.dev strong{font-size:.92rem} .dev span{font-size:.78rem;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:2px 0}
.ev{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev time{font-size:.74rem;color:var(--muted)} .ev .tag{font-size:.7rem;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item strong{font-size:.92rem;font-weight:600} .item small{display:block;color:var(--muted);font-size:.76rem}
.item .chev{color:var(--muted)}
.back{background:none;border:0;color:var(--muted);font:600 .9rem var(--body);cursor:pointer;display:block;margin:10px auto;text-align:center}
.err{color:var(--bad);font-size:.84rem;margin:6px 0}
.msg{color:var(--accent);font-size:.86rem;margin:6px 0}
.code{font-family:var(--display);font-size:2rem;color:var(--accent);letter-spacing:.1em}
.center{text-align:center}
.install{position:fixed;left:12px;right:12px;bottom:12px;max-width:436px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.84rem;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.18);display:none}
.install b{font-weight:700}
.install button{float:right;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div class="install" id="install">
  <button onclick="document.getElementById('install').style.display='none'">✕</button>
  <b>Instale o Aliança:</b> toque em <b>Compartilhar</b> e depois <b>"Adicionar à Tela de Início"</b>.
</div>
<script>
const app = document.getElementById('app');
const S = {
  get token(){return localStorage.getItem('token')}, set token(v){v?localStorage.setItem('token',v):localStorage.removeItem('token')},
  get genero(){return localStorage.getItem('genero')||'ele'}, set genero(v){localStorage.setItem('genero',v)},
  get tema(){return localStorage.getItem('tema')||'claro'}, set tema(v){localStorage.setItem('tema',v)},
};
function applyTheme(){
  const r=document.documentElement;
  r.setAttribute('data-skin', S.genero==='ela'?'ela':'ele');
  if(S.tema==='escuro') r.setAttribute('data-theme','dark');
  else if(S.tema==='claro') r.removeAttribute('data-theme');
  else { if(matchMedia('(prefers-color-scheme:dark)').matches) r.setAttribute('data-theme','dark'); else r.removeAttribute('data-theme'); }
}
async function api(path,{method='GET',body=null,auth=true}={}){
  const headers={'content-type':'application/json'};
  if(auth && S.token) headers['authorization']='Bearer '+S.token;
  try{
    const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});
    let data={}; try{data=await r.json()}catch(e){}
    return {ok:r.ok,data,erro:r.ok?null:(data.erro||('Erro '+r.status))};
  }catch(e){ return {ok:false,data:{},erro:'Sem conexão com o servidor.'}; }
}
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tela='home';
function nav(t){ tela=t; render(); }
function fmtData(iso){ try{const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }

const brand = '<div class="brand"><img src="/icon-192.png" alt=""><b>Aliança</b></div>';

// ---------- telas de entrada ----------
function telaLogin(){
  app.innerHTML = `<div class="top">${brand}</div>
  <div class="card hero"><span class="label">Entrar</span><p class="big">Bem-vindo de volta</p></div>
  <div class="card">
    <div class="field"><label>E-mail</label><input id="e" type="email" placeholder="voce@email.com"></div>
    <div class="field"><label>Senha</label><input id="s" type="password" placeholder="••••••••"></div>
    <div id="err" class="err" hidden></div>
    <button class="btn primary" id="go">Entrar</button>
  </div>
  <button class="back" id="toPar">Sou o cônjuge, tenho um código</button>
  <button class="back" id="toCad">Criar conta nova</button>`;
  document.getElementById('go').onclick=async()=>{
    const r=await api('/auth/login',{auth:false,method:'POST',body:{email:val('e').trim(),senha:val('s')}});
    if(r.ok){ S.token=r.data.token; S.genero=r.data.usuario?.genero||'ele'; applyTheme(); tela='home'; render(); }
    else showErr(r.erro);
  };
  document.getElementById('toPar').onclick=()=>telaPareamento();
  document.getElementById('toCad').onclick=()=>telaCadastro();
}
function telaCadastro(){
  app.innerHTML=`<div class="top">${brand}</div>
  <div class="card hero"><span class="label">Criar conta</span><p class="big">Proteção para a casa toda</p></div>
  <div class="card">
    <div class="field"><label>Nome</label><input id="n" placeholder="Como quer ser chamado"></div>
    <div class="field"><label>E-mail</label><input id="e" type="email"></div>
    <div class="field"><label>Senha (mín. 6)</label><input id="s" type="password"></div>
    <div class="field"><label>Sou</label><div class="seg"><button id="ge" aria-pressed="true">Ele</button><button id="ga" aria-pressed="false">Ela</button></div></div>
    <div id="err" class="err" hidden></div>
    <button class="btn primary" id="go">Criar conta</button>
  </div>
  <button class="back" id="toLogin">Já tenho conta</button>`;
  let g='ele';
  document.getElementById('ge').onclick=()=>{g='ele';press('ge','ga');};
  document.getElementById('ga').onclick=()=>{g='ela';press('ga','ge');};
  document.getElementById('go').onclick=async()=>{
    const r=await api('/auth/signup',{auth:false,method:'POST',body:{nome:val('n').trim(),email:val('e').trim(),senha:val('s'),genero:g}});
    if(r.ok){ S.token=r.data.token; S.genero=g; applyTheme(); tela='home'; render(); } else showErr(r.erro);
  };
  document.getElementById('toLogin').onclick=telaLogin;
}
function telaPareamento(){
  app.innerHTML=`<div class="top">${brand}</div>
  <div class="card hero"><span class="label">Seu guardião</span><p class="big">Entrar com o código</p><p>Use o código que seu cônjuge gerou no app dele.</p></div>
  <div class="card">
    <div class="field"><label>Código (6 dígitos)</label><input id="c" inputmode="numeric" placeholder="000000"></div>
    <div class="field"><label>Seu e-mail</label><input id="e" type="email"></div>
    <div class="field"><label>Crie uma senha</label><input id="s" type="password"></div>
    <div id="err" class="err" hidden></div>
    <button class="btn primary" id="go">Entrar na conta</button>
  </div>
  <button class="back" id="toLogin">Voltar</button>`;
  document.getElementById('go').onclick=async()=>{
    const r=await api('/auth/guardiao/entrar',{auth:false,method:'POST',body:{codigo:val('c').trim(),email:val('e').trim(),senha:val('s')}});
    if(r.ok){ S.token=r.data.token; S.genero=r.data.usuario?.genero||'ela'; applyTheme(); tela='home'; render(); } else showErr(r.erro);
  };
  document.getElementById('toLogin').onclick=telaLogin;
}

// ---------- app logado ----------
async function telaHome(){
  app.innerHTML=`<div class="top">${brand}<span class="who">carregando…</span></div>`;
  const me=await api('/me'); if(!me.ok){ if(me.erro&&me.erro.includes('401')){S.token=null;return render();} }
  const usuario=me.data.usuario||{}, familia=me.data.familia||{};
  const papel=usuario.papel||'', ehG=papel==='guardiao';
  S.genero=usuario.genero||S.genero; applyTheme();
  const membros=familia.membros||[];
  const nomeDe=(...ps)=>{const m=membros.find(x=>ps.includes(x.papel));return m?m.nome:'';};
  const nomeTit=nomeDe('titular','dono'), nomeGua=nomeDe('guardiao');
  const [jr,dv]=await Promise.all([api('/journey'),api('/devices')]);
  const j=jr.ok?jr.data:{}, aps=(dv.ok?dv.data.aparelhos:[])||[];
  let h = `<div class="top">${brand}<span class="who">${ehG?'Guardiã · ':'Olá, '}${esc(usuario.nome||'')}</span></div>`;
  if(ehG){
    h+=`<div class="card hero"><span class="label">Resumo</span><p class="big">Vocês caminham juntos</p><p>${nomeTit?('Você também está protegida, com '+esc(nomeTit)+' como seu guardião.'):'Vocês caminham juntos.'}</p></div>`;
    h+=`<div class="card"><span class="label">Guia do guardião</span><p class="ink">Primeiro escute, não interrogue. A luta é dele(a) contra o hábito — não contra você. Combinem um próximo passo juntos, nunca um castigo.</p></div>`;
    h+=caminhada(j,true,nomeTit);
    h+=`<div class="stats"><div class="stat"><b>${j.diasFirmes||0}</b><span>dias firme</span></div><div class="stat"><b>${j.tentativasSemana||0}</b><span>tentativas/sem</span></div><div class="stat"><b>${j.remocoes||0}</b><span>remoções</span></div></div>`;
    h+=cardAparelhos(aps,usuario.id);
    h+=`<div class="card"><div class="item" onclick="nav('avisos')"><div><strong>Avisos</strong><small>Alertas e recados do casal</small></div><span class="chev">›</span></div></div>`;
    if((j.historico||[]).length){ h+=`<div class="card"><span class="label">Histórico</span>`+ (j.historico.map(e=>`<div class="ev"><time>${fmtData(e.ts)}</time><div><span class="tag" style="color:${tagCor(e.tipo)}">${esc(e.titulo)}</span><br>${esc(e.corpo)}</div></div>`).join('')) +`</div>`; }
  } else {
    const prot=aps.find(a=>a.donoId===usuario.id);
    const st=prot?prot.status:'offline';
    h+=`<div class="card hero ${st==='protegido'?'':'warn'}"><span class="label">Sua proteção</span><p class="big">${st==='protegido'?'Protegido e caminhando':'Proteção do iPhone'}</p><p>No iPhone, a proteção é o <b>perfil de DNS</b> que você instalou (bloqueia no Wi-Fi e nos dados). ${nomeGua?('Guardião(ã): '+esc(nomeGua)+'.'):''}</p></div>`;
    h+=caminhada(j,false);
    h+=blocoConvite(familia);
    h+=cardAparelhos(aps,usuario.id);
    h+=`<div class="card"><span class="label">Um tempo de vocês dois</span><p>Reencontro, não escape. Convide seu cônjuge.</p><button class="btn soft" onclick="nav('convite')">Abrir convite</button></div>`;
    h+=`<div class="card"><div class="item" onclick="nav('avisos')"><div><strong>Avisos</strong><small>Alertas e recados</small></div><span class="chev">›</span></div></div>`;
    h+=`<div class="card"><span class="label">Palavra de hoje</span><p class="verse">"Vigiai e orai, para que não entreis em tentação."</p><span class="ref">MATEUS 26:41</span></div>`;
  }
  h+=`<div class="card"><div class="item" onclick="nav('perfil')"><div><strong>Perfil e configurações</strong><small>Aparência, PIN, sair</small></div><span class="chev">›</span></div></div>`;
  app.innerHTML=h;
}
function caminhada(j,forG,nomeTit){
  const dias=j.diasFirmes||0, meta=j.meta||90, marcos=[7,21,66,90];
  const pct=Math.min(100,dias/meta*100);
  const mk=marcos.map(m=>{const x=m/meta*100,done=dias>=m;return `<span class="mk" style="left:${x}%"></span><span class="lab ${done?'done':''}" style="left:${x}%">${m}</span>`;}).join('');
  const prox=j.proximoMarco||0, falt=j.faltamParaProximo||0;
  return `<div class="card goal"><span class="label">${forG?('A caminhada de '+esc(nomeTit||'')):'Sua caminhada'}</span>
    <div class="row" style="align-items:baseline"><div><b>${dias}</b> <span style="color:var(--muted);font-size:.82rem">dias firmes</span></div><span style="color:var(--muted);font-size:.82rem">meta ${meta}</span></div>
    <div class="bar"><div class="fill" style="width:${pct}%"></div>${mk}</div>
    ${prox>0?`<p>Faltam <b style="color:var(--accent)">${falt} dias</b> para o próximo marco. ${forG?'Uma palavra sua hoje ajuda.':'Um dia de cada vez.'}</p>`:''}</div>`;
}
function tagCor(t){ return t==='tentativa'?'var(--gold)':(t==='remocao'||t==='protecao_off')?'var(--bad)':'var(--good)'; }
function cardAparelhos(aps,meuId){
  if(!aps.length) return '';
  const linha=(a,i)=>{const st=a.status; const [txt,cls]=st==='protegido'?['Protegido','ok']:st==='removido'?['Desligado','bad']:['Offline','wait'];
    return `${i?'<div class="divider"></div>':''}<div class="row"><div class="dev"><strong>${esc(a.nome||'Aparelho')}</strong><span>${a.donoId===meuId?'Este aparelho':'Aparelho da família'}</span></div><span class="pill ${cls}">${txt}</span></div>`;};
  return `<div class="card">${aps.map(linha).join('')}</div>`;
}
function blocoConvite(familia){
  if(familia.temGuardiao) return '';
  return `<div class="card"><span class="label">Seu guardião</span><p>Convide seu cônjuge para caminhar com você — ele recebe os avisos.</p><button class="btn soft" onclick="gerarCodigo()">Convidar meu cônjuge</button><div id="codebox"></div></div>`;
}
async function gerarCodigo(){
  const nome=prompt('Nome do seu cônjuge:'); if(!nome) return;
  const r=await api('/household/guardiao',{method:'POST',body:{nome:nome.trim()}});
  if(r.ok){ document.getElementById('codebox').innerHTML=`<div class="center" style="margin-top:10px"><div class="label">Código para seu cônjuge</div><div class="code">${esc(r.data.codigoPareamento)}</div></div>`; }
  else alert(r.erro);
}

async function telaAvisos(){
  app.innerHTML=`<div class="top">${brand}<span class="who">Avisos</span></div><p>carregando…</p>`;
  const r=await api('/messages'); const msgs=(r.ok?r.data.mensagens:[])||[];
  let h=`<div class="top">${brand}<span class="who">Avisos</span></div>`;
  if(!msgs.length) h+=`<div class="card hero"><span class="label">Tudo em paz</span><p class="ink">Nenhum aviso por aqui agora.</p></div>`;
  else h+=msgs.map(m=>`<div class="card"><div class="row"><strong>${esc(m.titulo)}</strong>${m.lida?'':'<span class="pill wait">Novo</span>'}</div><p class="ink">${esc(m.corpo)}</p>${m.lida?'':`<button class="btn ghost" onclick="lerMsg('${m.id}')">Marcar como lida</button>`}</div>`).join('');
  h+=`<button class="back" onclick="nav('home')">‹ Voltar</button>`;
  app.innerHTML=h;
}
async function lerMsg(id){ await api('/messages/'+id+'/lida',{method:'POST',body:{}}); telaAvisos(); }

async function telaJornada(){
  app.innerHTML=`<div class="top">${brand}<span class="who">Dias firmes</span></div><p>carregando…</p>`;
  const r=await api('/journey'); const j=r.ok?r.data:{};
  let h=`<div class="top">${brand}<span class="who">Dias firmes</span></div>`+caminhada(j,false);
  h+=`<div class="card"><span class="label">Recomeçar</span><p class="ink">Teve uma recaída? Sem culpa — registre e recomece.</p><button class="btn ghost" onclick="recaida()">Registrar uma recaída</button></div>`;
  h+=`<button class="back" onclick="nav('home')">‹ Voltar</button>`;
  app.innerHTML=h;
}
async function recaida(){ if(!confirm('Recomeçar a contagem do zero?')) return; await api('/journey/recaida',{method:'POST',body:{}}); telaJornada(); }

async function telaConvite(){
  app.innerHTML=`<div class="top">${brand}<span class="who">Convite</span></div><p>carregando…</p>`;
  const [me,cv]=await Promise.all([api('/me'),api('/convite')]);
  const papel=me.data.usuario?.papel||''; const ehG=papel==='guardiao';
  const c=cv.data.convite||null; const estado=c?c.estado:'';
  let inner='';
  if(ehG){
    if(estado==='pendente') inner=`<p class="ink">Seu cônjuge está te convidando para um tempo a sós.</p><div class="field"><label>Quando?</label><input id="q" placeholder="ex: sexta à noite"></div><button class="btn accent" onclick="responder(true)">Aceitar</button><button class="btn ghost" onclick="responder(false)">Agora não</button>`;
    else if(estado==='aceito') inner=`<p class="ink">Encontro marcado: ${esc(c.quando)}</p>`;
    else inner=`<p>Nenhum convite pendente agora.</p>`;
  } else {
    if(estado==='pendente') inner=`<p>Convite enviado. Aguardando a resposta do seu cônjuge.</p>`;
    else if(estado==='aceito') inner=`<p class="ink">Seu cônjuge topou! Encontro: ${esc(c.quando)}</p>`;
    else inner=`${estado==='recusado'?'<p>Agora não deu — mas vocês estão juntos nisso.</p>':''}<button class="btn accent" onclick="enviarConvite()">Convidar para uma noite a sós</button>`;
  }
  app.innerHTML=`<div class="top">${brand}<span class="who">Convite</span></div>
    <div class="card hero"><span class="label">Um tempo de vocês dois</span><p class="big">Reencontro, não escape</p></div>
    <div class="card" id="cv">${inner}</div><button class="back" onclick="nav('home')">‹ Voltar</button>`;
}

    <p class="ink">O iPhone não deixa um app travar o sistema. A blindagem real é o próprio <b>Tempo de Uso</b> da Apple, com a senha na mão do seu cônjuge — assim você não consegue desligar o filtro sozinho.</p></div>

  <div class="card"><span class="label">Parte 1 · Filtro da Apple (o cônjuge faz)</span>
    <p class="ink">1. Ajustes → <b>Tempo de Uso</b>.<br>
    2. Role até <b>"Usar código do Tempo de Uso"</b> e crie um código de 4 dígitos. <b>Quem digita é o cônjuge</b> — o dono do iPhone não pode saber.<br>
    3. <b>Conteúdo e Privacidade</b> → ligue <b>Restrições de Conteúdo e Privacidade</b>.<br>
    4. <b>Restrições de Conteúdo</b> → <b>Conteúdo Web</b> → marque <b>"Limitar sites adultos"</b>.</p></div>

  <div class="card"><span class="label">Parte 2 · Travar mudanças</span>
    <p class="ink">Ainda em <b>Conteúdo e Privacidade</b>, em <b>"Permitir alterações"</b>, marque <b>"Não permitir"</b> em:<br>
    • <b>Alterações de conta</b><br>• <b>VPN e DNS</b> (quando aparecer)<br>• <b>Alterações de código</b><br>
    Assim o filtro e as configurações ficam presos atrás do código do cônjuge.</p></div>

  <div class="card"><span class="label">Parte 3 · Camada do Aliança</span>
    <p class="ink">Instale também o <b>perfil de DNS do Aliança</b> (o arquivo que você recebeu). Ele reforça o bloqueio dentro de apps e no navegador. Se um dia ele for removido, <b>seu cônjuge é avisado</b> automaticamente.</p></div>

  <div class="card"><span class="label">Importante, com honestidade</span>
    <p class="ink">Essa é a proteção máxima para um iPhone comum. A única forma de deixar o perfil <b>impossível</b> de remover (como no Android) seria apagar e supervisionar o aparelho por um Mac — coisa de empresa, não recomendada aqui. Com o Tempo de Uso + a senha no cônjuge, na prática ninguém desliga sozinho.</p></div>

async function telaPerfil(){
  app.innerHTML=`<div class="top">${brand}<span class="who">Perfil</span></div><p>carregando…</p>`;
  const [me,sub]=await Promise.all([api('/me'),api('/subscription')]);
  const u=me.data.usuario||{}, fam=me.data.familia||{};
  const estado=sub.ok?(sub.data.assinatura?.estado||''):'';
  const temPin=!!fam.temPin;
  let h=`<div class="top">${brand}<span class="who">Perfil</span></div>
  <div class="card"><div class="row"><div class="dev"><strong style="font-size:1.05rem">${esc(u.nome||'Você')}</strong><span>${esc(u.email||'')}</span></div></div></div>
  <div class="card"><span class="label">Aparência</span><div class="seg">
    <button data-t="auto" aria-pressed="${S.tema==='auto'}">Automático</button>
    <button data-t="claro" aria-pressed="${S.tema==='claro'}">Claro</button>
    <button data-t="escuro" aria-pressed="${S.tema==='escuro'}">Escuro</button></div></div>
  <div class="card"><span class="label">Assinatura</span><div class="row"><strong>${({ativa:'Proteção garantida',pendente:'Aguardando pagamento',vencida:'Pagamento em atraso',cancelada:'Cancelada'})[estado]||'—'}</strong><span class="pill ${estado==='ativa'?'ok':'wait'}">${estado==='ativa'?'Ativa':'Pendente'}</span></div></div>`;
  h+=cartaoAvisosHTML();
  if(!temPin){ h+=`<div class="card"><span class="label">PIN de proteção</span><p class="ink">Defina um PIN de 4 dígitos (idealmente o cônjuge digita). Depois, só com ele se sai da conta.</p><div class="field"><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="btn accent" onclick="salvarPin()">Salvar PIN</button></div>`; }
  h+=`<div class="card"><div class="item" onclick="nav('jornada')"><div><strong>Dias firmes</strong><small>Sua caminhada e marcos</small></div><span class="chev">›</span></div></div>`;
  h+=`<div class="card"><div class="item" onclick="nav('blindagem')"><div><strong>Blindagem do iPhone</strong><small>Deixar a proteção forte no iPhone</small></div><span class="chev">›</span></div></div>`;
  h+=`<div class="card"><span class="label">Sair da conta</span><p class="ink">Sair exige o PIN do cônjuge.</p><div class="field"><input id="lo" inputmode="numeric" maxlength="4" placeholder="PIN do cônjuge"></div><button class="btn danger" onclick="sair()">Sair da conta</button></div>`;
  h+=`<button class="back" onclick="nav('home')">‹ Voltar</button>`;
  app.innerHTML=h;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tema=b.dataset.t;applyTheme();telaPerfil();});
  const bn=document.getElementById('btnAtivarNotif'); if(bn) bn.onclick=async()=>{ bn.textContent='Ativando…'; await ativarNotificacoes(true); telaPerfil(); };
}
function ehIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
// Cartão de avisos do Perfil — mostra o estado atual e o passo certo pra ativar.
function cartaoAvisosHTML(){
  const L='<div class="card"><span class="label">Avisos no celular</span>';
  if(!suportaPush()){
    return L+`<p class="ink">Seu navegador não suporta avisos. No iPhone, use o Safari e adicione o app à Tela de Início.</p></div>`;
  }
  const perm=Notification.permission;
  if(perm==='granted'){
    return L+`<div class="row"><strong>Avisos ativados</strong><span class="pill ok">Ativo</span></div>
      <p class="ink">Você recebe quando a proteção mudar, mesmo com o app fechado.</p></div>`;
  }
  if(ehIOS() && !ehStandalone()){
    return L+`<p class="ink">Para receber avisos no iPhone, primeiro instale o app:</p>
      <p class="ink">1. Toque em <b>Compartilhar</b> (ícone de quadrado com seta).<br>2. Escolha <b>"Adicionar à Tela de Início"</b>.<br>3. Abra o Aliança pelo <b>ícone na tela</b> e volte aqui para ativar.</p></div>`;
  }
  if(perm==='denied'){
    const passo = ehIOS()
      ? 'Abra os <b>Ajustes</b> do iPhone → role até <b>Aliança</b> → <b>Notificações</b> → ative <b>Permitir Notificações</b>.'
      : 'Abra as configurações do site no navegador e permita as notificações.';
    return L+`<div class="row"><strong>Avisos bloqueados</strong><span class="pill wait">Desligado</span></div>
      <p class="ink">${passo}</p></div>`;
  }
  return L+`<p class="ink">Ative para ser avisado quando a proteção mudar — mesmo com o app fechado.</p>
    <button class="btn accent" id="btnAtivarNotif">Ativar avisos</button></div>`;
}
async function salvarPin(){ const r=await api('/household/pin',{method:'POST',body:{pin:val('pin')}}); if(r.ok) telaPerfil(); else alert(r.erro); }
async function sair(){ const r=await api('/auth/logout',{method:'POST',body:{pin:val('lo')}}); if(r.ok){ S.token=null; tela='home'; render(); } else alert(r.erro); }

function press(on,off){document.getElementById(on).setAttribute('aria-pressed','true');document.getElementById(off).setAttribute('aria-pressed','false');}

// ---------- Notificações (Web Push) ----------
// No iPhone só funciona com o app ADICIONADO À TELA DE INÍCIO (iOS 16.4+).
function ehStandalone(){ return window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; }
function suportaPush(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64ToUint8(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
async function ativarNotificacoes(pedirPermissao){
  if(!suportaPush() || !S.token) return false;
  try{
    let perm=Notification.permission;
    if(perm==='default' && pedirPermissao) perm=await Notification.requestPermission();
    if(perm!=='granted') return false;
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const r=await api('/app/web-push/chave',{auth:false});
      if(!r.ok || !r.data.chave) return false;
      sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToUint8(r.data.chave)});
    }
    await api('/app/web-push/inscrever',{method:'POST',body:{inscricao:sub.toJSON()}});
    const b=document.getElementById('notifBanner'); if(b) b.remove();
    return true;
  }catch(e){ return false; }
}
// Mostra um banner só quando faz sentido: app instalado, com login, sem permissão ainda.
function avaliaNotif(){
  if(!S.token || !suportaPush()) return;
  if(Notification.permission==='granted'){ ativarNotificacoes(false); return; } // reinscreve em silêncio
  if(Notification.permission!=='default') return; // negado: não insiste
  if(!ehStandalone()) return; // no Safari (aba) o iPhone não entrega push
  if(document.getElementById('notifBanner')) return;
  const el=document.createElement('div');
  el.id='notifBanner';
  el.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:var(--card,#123c2e);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;font-family:system-ui';
  el.innerHTML='<div style="flex:1;line-height:1.3"><b>Ativar avisos</b><br><span style="opacity:.85;font-size:13px">Receba quando a proteção mudar, mesmo com o app fechado.</span></div>';
  const btn=document.createElement('button');
  btn.textContent='Ativar';
  btn.style.cssText='background:#fff;color:#123c2e;border:0;border-radius:12px;padding:10px 16px;font-weight:700';
  btn.onclick=()=>ativarNotificacoes(true);
  el.appendChild(btn);
  document.body.appendChild(el);
}
setTimeout(avaliaNotif, 2000);
